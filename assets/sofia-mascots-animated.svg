<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180" role="img" aria-labelledby="title desc">
<title id="title">Sofia Agent characters</title><desc id="desc">A colorful group of friendly abstract agent mascots gently floating.</desc>
<defs>
