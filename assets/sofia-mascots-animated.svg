<path d="M203 32 l3 6 6 1 -5 4 1 6 -5 -3 -5 3 1 -6 -5 -4 6 -1z" fill="#4ade80"><animate attributeName="opacity" values=".4;1;.4" dur="2.6s" repeatCount="indefinite"/></path>
</svg>