<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" role="img" aria-labelledby="title desc">
<title id="title">Sofia Agent — uploaded mascot image</title><desc id="desc">The exact mascot image provided by the user, gently floating.</desc>
<defs><filter id="glow" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="280" height="280" rx="18" fill="#050806"/>
<g filter="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="3.4s" repeatCount="indefinite"/>
<image href="data:image/jpeg;base64," x="8" y="8" width="264" height="264" preserveAspectRatio="xMidYMid meet"/>
</g></svg>