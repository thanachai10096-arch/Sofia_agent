 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4b0ff"/><stop offset="1" stop-color="#8053d8"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="240" height="180" rx="18" fill="#080d0a"/>
