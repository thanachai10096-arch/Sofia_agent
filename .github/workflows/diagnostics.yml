name: Sofia Diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Runner smoke test
        run: |
          node --version
          npm --version
          echo "runner-ok" > runner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sofia-diagnostics
          path: runner.log
