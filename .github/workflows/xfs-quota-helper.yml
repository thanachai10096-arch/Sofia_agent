name: XFS quota helper validation

on:
  pull_request:
    paths:
      - "scripts/sofia-xfs-quota-helper.py"
      - "scripts/test_sofia_xfs_quota_helper.py"
      - ".github/workflows/xfs-quota-helper.yml"
  push:
    branches:
      - "feat/sofia-autonomy-controller"
    paths:
      - "scripts/sofia-xfs-quota-helper.py"
      - "scripts/test_sofia_xfs_quota_helper.py"
      - ".github/workflows/xfs-quota-helper.yml"

permissions:
  contents: read

jobs:
  helper-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile helper
        run: python -m py_compile scripts/sofia-xfs-quota-helper.py scripts/test_sofia_xfs_quota_helper.py
      - name: Run helper unit tests
        run: python -m unittest scripts/test_sofia_xfs_quota_helper.py
