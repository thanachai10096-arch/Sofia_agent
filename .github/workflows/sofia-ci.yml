name: Sofia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofia-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: License check
        run: npm run license:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  container-sandbox-smoke:
    name: Container sandbox integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve and preload an immutable test image
        shell: bash
        run: |
          docker pull node:22-alpine
          image_ref="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          if [[ ! "$image_ref" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a SHA-256-pinned Docker image."
            exit 1
          fi
          echo "SOFIA_SANDBOX_IMAGE=$image_ref" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Verify real container isolation
        run: node scripts/container-sandbox-smoke.mjs

      - name: Verify browser egress proxy against public HTTP and HTTPS
        run: node scripts/browser-egress-proxy-smoke.mjs


  browser-runtime-smoke:
    name: Playwright browser egress integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify Playwright egress policy
        run: node scripts/playwright-egress-runtime-smoke.mjs

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  source-provenance-inventory:
    name: Source provenance line inventory (not a copyright verdict)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate line-level Git attribution report
        run: npm run provenance:report -- "$RUNNER_TEMP/sofia-code-provenance-lines.csv"

      - name: Upload provenance inventory
        uses: actions/upload-artifact@v4
        with:
          name: sofia-code-provenance-lines
          path: ${{ runner.temp }}/sofia-code-provenance-lines.csv
          if-no-files-found: error
          retention-days: 14
