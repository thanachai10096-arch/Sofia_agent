name: Sofia CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sofia-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: License check
        run: npm run license:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  container-sandbox-smoke:
    name: Container sandbox integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Resolve and preload an immutable test image
        shell: bash
        run: |
          docker pull node:22-alpine
          image_ref="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          if [[ ! "$image_ref" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve a SHA-256-pinned Docker image."
            exit 1
          fi
          echo "SOFIA_SANDBOX_IMAGE=$image_ref" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Verify real container isolation
        run: node scripts/container-sandbox-smoke.mjs

      - name: Verify browser egress proxy against public HTTP and HTTPS
        run: node scripts/browser-egress-proxy-smoke.mjs


  browser-runtime-smoke:
    name: Playwright browser egress integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verify Playwright egress policy
        run: node scripts/playwright-egress-runtime-smoke.mjs

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  postgres-job-state-integration:
    name: PostgreSQL multi-worker job state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sofia_test
          POSTGRES_PASSWORD: sofia_test
          POSTGRES_DB: sofia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sofia_test -d sofia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install PostgreSQL integration driver without changing manifests
        run: npm install --no-save --package-lock=false --no-audit --no-fund pg

      - name: Build
        run: npm run build

      - name: Verify cross-worker claims, lease fencing and cancellation
        run: node scripts/postgres-job-state-integration.mjs
        env:
          SOFIA_TEST_DATABASE_URL: postgresql://sofia_test:sofia_test@localhost:5432/sofia_test
