name: Sofia Benchmark
on:
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths:
      - "bench/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node bench/run.mjs --selftest
      - run: node bench/run.mjs --agent noop
      - run: node bench/run.mjs --agent reference
