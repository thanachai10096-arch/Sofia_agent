name: Self-hosted distribution CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "scripts/sofia-*.sh"
      - "scripts/sofia-*.mjs"
      - "docs/SELF_HOSTED_*.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/self-hosted.yml"
  push:
    branches:
      - feat/self-hosted-distribution
    paths:
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "scripts/sofia-*.sh"
      - "scripts/sofia-*.mjs"
      - "docs/SELF_HOSTED_*.md"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/self-hosted.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate installer, backup, restore, upgrade and rollback shell syntax
        run: |
          bash -n scripts/sofia-install.sh
          bash -n scripts/sofia-backup.sh
          bash -n scripts/sofia-restore.sh
          bash -n scripts/sofia-upgrade.sh
          bash -n scripts/sofia-rollback.sh
          bash -n scripts/sofia-lifecycle.sh
          bash -n scripts/sofia-self-hosted-smoke.sh
          bash -n scripts/sofia-isolation-smoke.sh
      - name: Test state migration safety
        run: node --test scripts/sofia-migrate-state.test.mjs

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          API_KEY="$(openssl rand -hex 32)"
          sed -i "s/^SOFIA_API_KEY=.*/SOFIA_API_KEY=$API_KEY/" .env
          docker compose config --quiet

      - name: Build production image
        run: docker build --tag sofia-agent:self-hosted-ci .

      - name: Clean-volume container acceptance test
        run: bash scripts/sofia-self-hosted-smoke.sh
      - name: Multi-installation credential and volume isolation test
        run: bash scripts/sofia-isolation-smoke.sh
