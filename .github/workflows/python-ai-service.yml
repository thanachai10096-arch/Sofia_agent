name: Python AI Service

on:
  push:
    branches: [main]
    paths:
      - "python/ai-service/**"
      - ".github/workflows/python-ai-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/ai-service/**"
      - ".github/workflows/python-ai-service.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ai-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / Ruff / Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/ai-service/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
