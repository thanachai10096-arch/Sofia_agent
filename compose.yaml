services:
  sofia:
    build:
      context: .
      dockerfile: Dockerfile
    image: sofia-agent:local
    container_name: sofia-agent
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SOFIA_WORKSPACE: /data/workspace
      SOFIA_STATE_DIR: /data/state
          ports:
      - "${SOFIA_BIND_ADDRESS:-127.0.0.1}:${SOFIA_HOST_PORT:-3000}:3000"
    volumes:
      - sofia-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    stop_grace_period: 30s

volumes:
  sofia-data:
    name: sofia-agent-data
